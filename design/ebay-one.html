<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Number one on eBay card — portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#101010}
.card{width:1200px;height:900px;position:relative;background:#101010;color:#F4F1EB;font-family:"Inter",Arial,sans-serif;overflow:hidden}
.card .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1.2px,transparent 1.4px);background-size:36px 36px;background-position:18px 18px}
.card .glow{position:absolute;left:50%;top:56%;width:900px;height:520px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,45,141,.22),rgba(255,45,141,0));filter:blur(10px)}
.k{position:absolute;left:0;right:0;top:92px;text-align:center;font-size:17px;letter-spacing:.34em;text-transform:uppercase;color:#FF2D8D;font-weight:600}
.ebay{position:absolute;left:0;right:0;top:150px;text-align:center;font-family:"Inter",Arial,sans-serif;font-weight:700;font-size:210px;line-height:1;letter-spacing:-.06em}
.ebay b{font-weight:700}
.ebay b:nth-child(1){color:#E53238}.ebay b:nth-child(2){color:#0064D2}.ebay b:nth-child(3){color:#F5AF02}.ebay b:nth-child(4){color:#86B817}
.card .line{position:absolute;left:0;right:0;top:414px;height:2px;background:linear-gradient(90deg,rgba(255,45,141,0),rgba(255,45,141,.9) 30%,rgba(255,45,141,.9) 70%,rgba(255,45,141,0))}
.n{position:absolute;left:0;right:0;top:436px;text-align:center;font-family:"Anton",Impact,sans-serif;font-size:300px;line-height:1;color:#FF2D8D;letter-spacing:-.01em;filter:drop-shadow(0 0 40px rgba(255,45,141,.35))}
.n small{font-size:.42em;vertical-align:top;line-height:1.5;color:#F4F1EB}
.t{position:absolute;left:0;right:0;top:756px;text-align:center;font-family:"Anton",Impact,sans-serif;font-size:56px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.s{position:absolute;left:0;right:0;top:830px;text-align:center;font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:#A8A6A1;font-weight:500}
</style>
</head>
<body>
<div class="card">
  <div class="dots"></div>
  <div class="glow"></div>
  <div class="k">eBay UK · August 2026</div>
  <div class="ebay"><b>e</b><b>b</b><b>a</b><b>y</b></div>
  <div class="line"></div>
  <div class="n">1<small>st</small></div>
  <div class="t">of 1,193 fire extinguisher sellers</div>
  <div class="s">In eBay's own report · and number one on Temu</div>
</div>
</body>
</html>
