<!doctype html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#101010}
.card{width:1200px;height:900px;position:relative;background:#101010;color:#F4F1EB;font-family:"Inter",Arial,sans-serif;overflow:hidden}
.card .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1.2px,transparent 1.4px);background-size:36px 36px;background-position:18px 18px}
.card .line{position:absolute;left:0;right:0;top:546px;height:2px;background:linear-gradient(90deg,rgba(255,45,141,0),rgba(255,45,141,.9) 30%,rgba(255,45,141,.9) 70%,rgba(255,45,141,0))}
.crown{position:absolute;left:50%;top:52px;width:600px;transform:translateX(-50%);filter:drop-shadow(0 0 30px rgba(255,45,141,.45))}
.k{position:absolute;left:0;right:0;top:578px;text-align:center;font-size:17px;letter-spacing:.34em;text-transform:uppercase;color:#FF2D8D;font-weight:600}
.t{position:absolute;left:0;right:0;top:614px;text-align:center;font-family:"Anton",Impact,sans-serif;font-size:82px;line-height:.98;text-transform:uppercase;letter-spacing:.005em}
.y{position:absolute;left:0;right:0;top:780px;text-align:center;font-family:"Anton",Impact,sans-serif;font-size:104px;line-height:1;color:#FF2D8D}
</style>
</head>
<body>
<div class="card">

    <circle cx="62" cy="120" r="10" fill="#F4F1EB"/><circle cx="200" cy="70" r="12" fill="#F4F1EB"/><circle cx="338" cy="120" r="10" fill="#F4F1EB"/>
    <circle cx="132" cy="176" r="5" fill="#FF2D8D"/><circle cx="268" cy="176" r="5" fill="#FF2D8D"/>
    <path d="M200 132 L216 156 L200 180 L184 156 Z" fill="#F4F1EB"/>
    <circle cx="110" cy="230" r="6.5" fill="#F4F1EB"/><circle cx="155" cy="230" r="6.5" fill="#F4F1EB"/><circle cx="200" cy="230" r="6.5" fill="#F4F1EB"/><circle cx="245" cy="230" r="6.5" fill="#F4F1EB"/><circle cx="290" cy="230" r="6.5" fill="#F4F1EB"/>
