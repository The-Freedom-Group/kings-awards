<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Number one on eBay card — The Way In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Serif:ital@1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* The Aug 2026 card on The Way In's timeline: the site's own black, red and white, its display face
   and its red italic, with the eBay mark set as type so it is sharp at any size. 1600 x 1200, the
   timeline's 4:3. Rendered to assets/journey/ebay-number-one.webp by tools/render_design.js. */
html,body{margin:0;background:#111}
.card{width:1600px;height:1200px;position:relative;background:#111;color:#fff;overflow:hidden;
  font-family:"Archivo","Arial Black",Impact,sans-serif}
.card .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.055) 1.4px,transparent 1.7px);background-size:40px 40px;background-position:20px 20px}
.card .glow{position:absolute;left:50%;top:58%;width:1180px;height:700px;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,rgba(225,6,0,.30),rgba(225,6,0,0));filter:blur(14px)}
.k{position:absolute;left:0;right:0;top:96px;text-align:center;font-family:"IBM Plex Mono",monospace;font-weight:500;
  font-size:22px;letter-spacing:.34em;text-transform:uppercase;color:#E10600}
.ebay{position:absolute;left:0;right:0;top:150px;text-align:center;font-size:250px;line-height:1;letter-spacing:-.065em;
  font-variation-settings:"wdth" 100,"wght" 800}
.ebay b{font-weight:800}
.ebay b:nth-child(1){color:#E53238}.ebay b:nth-child(2){color:#0064D2}.ebay b:nth-child(3){color:#F5AF02}.ebay b:nth-child(4){color:#86B817}
.card .line{position:absolute;left:0;right:0;top:436px;height:3px;
  background:linear-gradient(90deg,rgba(225,6,0,0),rgba(225,6,0,1) 22%,rgba(225,6,0,1) 78%,rgba(225,6,0,0))}
.n{position:absolute;left:0;right:0;top:446px;text-align:center;font-size:350px;line-height:1;letter-spacing:-.03em;color:#fff;
  font-variation-settings:"wdth" 118,"wght" 900;text-shadow:0 10px 60px rgba(0,0,0,.6)}
.sub{position:absolute;left:0;right:0;top:790px;text-align:center;font-family:"Instrument Serif",Georgia,serif;font-style:italic;
  font-size:136px;line-height:1;color:#E10600;letter-spacing:-.01em}
.t{position:absolute;left:0;right:0;top:972px;text-align:center;font-size:54px;line-height:1;text-transform:uppercase;letter-spacing:.03em;
  font-variation-settings:"wdth" 118,"wght" 900}
.s{position:absolute;left:0;right:0;top:1068px;text-align:center;font-family:"IBM Plex Mono",monospace;font-weight:500;
  font-size:19px;letter-spacing:.3em;text-transform:uppercase;color:#8A8A85}
</style>
</head>
<body>
<div class="card">
  <div class="dots"></div>
  <div class="glow"></div>
  <div class="k">eBay UK · listing quality report · August 2026</div>
  <div class="ebay"><b>e</b><b>b</b><b>a</b><b>y</b></div>
  <div class="line"></div>
  <div class="n">#1</div>
  <div class="sub">of 1,193 sellers.</div>
  <div class="t">Fire extinguishers · GB</div>
  <div class="s">In eBay's own report · and number one on Temu</div>
</div>
</body>
</html>
